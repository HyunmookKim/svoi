/* ── 테마: 밝게(화이트) · 어둡게(블랙). html[data-theme] 로 바꾼다 */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#F7F8FA; --ink:#111316; --sub:#6B7280; --faint:#9CA3AF; --line:#E8EAEE;
  --main:#111316; --onMain:#FFFFFF; --accent:#2F6BFF; --accentS:rgba(47,107,255,.10);

  --bar:rgba(242,243,245,.82); --tabbar:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(17,19,22,.04),0 4px 16px rgba(17,19,22,.05);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#000000; --card:#121316; --card2:#1A1C20; --ink:#F3F4F6; --sub:#9AA0A9; --faint:#6B7079; --line:#24262B;

  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);width:100%;border:1px solid transparent;

input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
label.f{display:block;font-size:13px;color:var(--sub);margin:18px 0 8px;font-weight:600}
/* 위 띠 — 색 띠 대신 배경과 같은 흐린 유리 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(18px);

#top h1{font-size:22px;font-weight:800;letter-spacing:-.03em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top.sub h1{font-size:17px;font-weight:700;text-align:center}
#top .back{display:none;width:40px;height:40px;margin-left:-10px;border-radius:12px;align-items:center;justify-content:center}
#top.sub .back{display:flex}
#top .back svg{width:24px;height:24px}
#langBtn{min-width:44px;height:34px;padding:0 12px;border-radius:17px;background:var(--card);font-size:13px;font-weight:700;box-shadow:var(--shadow);border:1px solid var(--line)}
main{padding:calc(var(--top) + 64px) 16px calc(var(--bot) + 96px);max-width:720px;margin:0 auto}
.screen{display:none;animation:fade .18s ease}
.screen.on{display:block}

.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
html[data-theme="dark"] .card{border:1px solid var(--line)}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--sub)}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.empty{padding:44px 16px;text-align:center;color:var(--sub)}
.empty b{color:var(--ink);font-size:17px}
.load{padding:28px;text-align:center;color:var(--faint);font-size:14px}
/* 분류 칸 — 아이콘 칩 */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--card);border-radius:20px;padding:16px;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:2px;
  box-shadow:var(--shadow);transition:transform .1s}
html[data-theme="dark"] .cat{border:1px solid var(--line)}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
.cat b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.cat span{font-size:12.5px;color:var(--sub);line-height:1.4}
.cat:active,.row:active,.link:active{transform:scale(.985);opacity:.85}
.row{display:block;position:relative;width:100%;text-align:left;background:var(--card);border-radius:18px;

html[data-theme="dark"] .row{border:1px solid var(--line)}
.row::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;margin-top:-5px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);transform:rotate(45deg)}
div.row::after{display:none}
div.row{padding-right:18px}
.row b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;word-break:break-word}
.row small{display:block;color:var(--sub);font-size:13px;margin-top:3px}
.row .txt{flex:1;min-width:0}
.link{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;transition:transform .1s}
.link small{font-weight:400}
.link:last-child{border-bottom:0;padding-bottom:2px}
/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:16px;
  background:var(--main);color:var(--onMain);font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98)}
.btn.wide{display:flex;width:100%;margin-top:14px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.gray{background:var(--card2);color:var(--ink)}
.btn.red{background:var(--warn);color:#fff}
.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--card);font-size:14px;font-weight:600;color:var(--sub);box-shadow:var(--shadow)}
html[data-theme="dark"] .chip{border:1px solid var(--line)}
.chip.on{background:var(--main);color:var(--onMain);border-color:var(--main)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--accentS);color:var(--accent);vertical-align:middle;letter-spacing:0}
.badge.ok{background:var(--okS);color:var(--ok)}
.badge.warn{background:var(--warnS);color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar .btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.meta{font-size:13px;color:var(--sub);margin-top:10px}
.body{word-break:break-word;font-size:16px;line-height:1.7}

.ans{border-top:1px solid var(--line);padding:16px 0}

.trbox{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card2);font-size:15px}

.check{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--main);padding:0}
.check span{flex:1}
.check button{color:var(--sub);font-size:14px;text-decoration:underline}

.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:34px;font-weight:800;letter-spacing:-.03em}
.fc .r{font-size:16px;color:var(--sub)}
.fc .m{font-size:21px;font-weight:700;color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades .btn{padding:0 4px;font-size:14px}
/* 아래 탭 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--bot)}

#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--ink)}
/* 아래에서 올라오는 창 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}

  padding:10px 18px calc(var(--bot) + 20px);max-width:720px;margin:0 auto;animation:up .2s ease}
#sheet .box::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}

.opt small{font-weight:400}
.opt.on{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 84px);z-index:50;background:var(--ink);color:var(--bg);
  padding:14px 16px;border-radius:14px;font-size:15px;font-weight:600;display:none;max-width:680px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{display:block;animation:up .2s ease}
</style>

function langFromDevice(){
  try{
    const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for(const raw of list){
      const v = String(raw || '').slice(0,2).toLowerCase();
      if(v === 'ko') return 'ko';
      if(['ru','uk','kk','uz','ky','be','tg','az','hy','ka','tk'].indexOf(v) >= 0) return 'ru';
    }
  }catch(_){}
  return 'ru';
}
function langNow(){
  try{ const v = localStorage.getItem('sv_lang'); if(v && LANGS.some(x=>x.v===v)) return v; }catch(_){}
  return langFromDevice();
}
function t(s){
  const k = String(s == null ? '' : s);
  const v = langNow();
  if(v === 'ko') return k;
  const d = I18N[v] || {};
  return d[k] || k;
}
// {ru,ko} 꼴 글자에서 지금 말에 맞는 것을 고른다
function pickL(o){ if(!o) return ''; if(typeof o === 'string') return o; const L = langNow(); return o[L] || o.ru || o.ko || ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function paintStatic(){
  document.documentElement.lang = langNow();
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
  $('langBtn').textContent = langNow() === 'ru' ? 'RU' : '한';
}
// 글 본문: 글자는 모두 escape 한 뒤 링크만 살린다
function linkify(s){
  return esc(s).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener nofollow">' + u + '</a>');
}
function plain(s){ return linkify(s).replace(/\n/g, '<br>'); }
// 문서 본문: ## 소제목 / - 목록 / 빈 줄 문단
function richText(s){
  const out = []; let list = null; let para = [];
  const flushP = () => { if(para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const flushL = () => { if(list){ out.push('<ul>' + list.join('') + '</ul>'); list = null; } };
  String(s || '').split('\n').forEach(line => {
    const l = line.trimEnd();
    if(/^##\s+/.test(l)){ flushP(); flushL(); out.push('<h3>' + linkify(l.replace(/^##\s+/, '')) + '</h3>'); }
    else if(/^-\s+/.test(l)){ flushP(); (list = list || []).push('<li>' + linkify(l.replace(/^-\s+/, '')) + '</li>'); }
    else if(!l.trim()){ flushP(); flushL(); }
    else { flushL(); para.push(linkify(l)); }
  });
  flushP(); flushL();
  return out.join('');
}
function ago(ts){
  const ms = ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : Date.now());
  const m = Math.floor((Date.now() - ms) / 60000);
  if(m < 1) return t('방금');
  if(m < 60) return m + ' ' + t('분 전');
  if(m < 1440) return Math.floor(m/60) + ' ' + t('시간 전');
  if(m < 1440*14) return Math.floor(m/1440) + ' ' + t('일 전');
  const d = new Date(ms);
  return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate();
}
function msOf(ts){ return ts && ts.toMillis ? ts.toMillis() : 0; }

let toastTimer = 0;
function tell(msg, ms){
  const el = $('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.classList.remove('on'), ms || 3000);
}
let sheetDone = null;
function openSheet(html){ if(sheetDone){ const f = sheetDone; sheetDone = null; f(null); } $('sheetBox').innerHTML = html; $('sheet').classList.add('on'); return $('sheetBox'); }
function closeSheet(v){ $('sheet').classList.remove('on'); const f = sheetDone; sheetDone = null; if(f) f(v); }
$('sheet').onclick = e => { if(e.target.id === 'sheet') closeSheet(null); };
// 예/아니오
function ask(msg, okLabel, danger){
  return new Promise(res => {
    const box = openSheet('<p>' + esc(msg) + '</p><div class="two"><button class="btn gray" data-v="0">' + esc(t('취소')) +
      '</button><button class="btn' + (danger ? ' red' : '') + '" data-v="1">' + esc(okLabel || t('확인')) + '</button></div>');
    sheetDone = v => res(!!v);
    box.querySelectorAll('[data-v]').forEach(b => b.onclick = () => closeSheet(b.dataset.v === '1'));
  });
}
// 여러 개 중 하나 고르기 → 값 또는 null
function choose(title, opts, cur){
  return new Promise(res => {
    const box = openSheet('<h3>' + esc(title) + '</h3>' + opts.map((o, i) =>
      '<button class="opt' + (o.v === cur ? ' on' : '') + '" data-i="' + i + '">' + esc(o.label) +
      (o.sub ? '<br><small class="muted">' + esc(o.sub) + '</small>' : '') + '</button>').join('') +
      '<button class="btn gray wide" data-x="1">' + esc(t('취소')) + '</button>');
    sheetDone = v => res(v == null ? null : v);
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => closeSheet(opts[+b.dataset.i].v));
    box.querySelector('[data-x]').onclick = () => closeSheet(null);
  });
}

  /씨\s*발/, /시발(?!점)/, /ㅅㅂ/, /ㅆㅂ/, /병\s*신/, /ㅂㅅ/, /개\s*새\s*끼/, /좆/, /지랄/, /니\s*애미/, /느금/, /꺼져/

function isBad(s){ const v = String(s || ''); return BAD.some(r => r.test(v)); }

    const app = A.initializeApp(C.firebaseConfig);
    let db;
    try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); }catch(_){ db = F.getFirestore(app); }
    FB = { app, A:Au, F, S, Fn, auth: Au.getAuth(app), db, st: S.getStorage(app), fn: Fn.getFunctions(app, REGION) };
    return FB;
  })();
  fbP.catch(() => { fbP = null; });
  return fbP;
}
function col(...p){ return FB.F.collection(FB.db, ...p); }

// ★ 나 (로그인 상태)
//   ME = null → 로그인 안 함 / ME.ready=false → 동의·닉네임 아직
// ══════════════════════════════════════════════════════════════════════
let ME = null;
let authKnown = false;
async function watchAuth(){
  await fb();
  FB.A.onAuthStateChanged(FB.auth, async u => {
    if(!u){ ME = null; authKnown = true; DATA.guides = null; refreshAfterAuth(); return; }
    ME = { uid: u.uid, email: u.email || '', name: '', ready: false, admin: false, banned: false, blocked: [] };
    try{
      const [ud, ad, bd] = await Promise.all([
        FB.F.getDoc(dref('users', u.uid)),
        FB.F.getDoc(dref('admins', u.uid)).catch(() => null),
        FB.F.getDoc(dref('bans', u.uid)).catch(() => null)
      ]);
      if(ud.exists()){
        const d = ud.data();
        ME.name = d.name || ''; ME.blocked = d.blocked || [];
        ME.ready = !!(d.consent && d.consent.ver >= CONSENT_VER) && !!ME.name;
      }
      ME.admin = !!(ad && ad.exists());
      ME.banned = !!(bd && bd.exists());
    }catch(_){}
    authKnown = true; DATA.guides = null;
    if(!ME.ready) openConsent();
    refreshAfterAuth();
  });
}
function refreshAfterAuth(){
  // 지금 보고 있는 곳을 다시 그린다 (깊은 화면이면 그 화면을)
  if(stack.length){ const top = stack[stack.length-1]; top.render(); }
  else RENDER[curTab]();
  if(afterLogin && ME && ME.ready){ const f = afterLogin; afterLogin = null; f(); }
}
let afterLogin = null;
// 로그인이 필요한 일 앞에 세우는 문. 됐으면 true.
function needLogin(then){
  if(ME && ME.ready){
    if(ME.banned){ tell(t('이용이 제한된 계정입니다')); return false; }
    return true;
  }
  afterLogin = then || null;
  if(ME && !ME.ready){ openConsent(); return false; }
  openLogin();
  return false;
}
function authMsg(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t('이메일 또는 비밀번호가 맞지 않습니다');
  if(/email-already-in-use/.test(c)) return t('이미 가입된 이메일입니다');
  if(/weak-password/.test(c)) return t('비밀번호는 6자 이상이어야 합니다');
  if(/invalid-email/.test(c)) return t('이메일 형식이 맞지 않습니다');
  if(/popup-closed|cancelled-popup/.test(c)) return t('로그인 창이 닫혔습니다');
  if(/too-many-requests|network/.test(c)) return t('잠시 후 다시 시도해 주세요');
  return t('로그인하지 못했습니다');
}

function openConsent(){
  const box = openSheet(

  const reqs = [...box.querySelectorAll('.cReq')];
  box.querySelector('#cAll').onchange = e => reqs.forEach(c => c.checked = e.target.checked);
  box.querySelectorAll('[data-doc]').forEach(b => b.onclick = ev => { ev.preventDefault(); closeSheet(null); openDoc(b.dataset.doc, true); });
  box.querySelector('#cOut').onclick = async () => { closeSheet(null); await FB.A.signOut(FB.auth); };

    if(!reqs.every(c => c.checked)){ tell(t('필수 항목에 동의해 주세요')); return; }
    const name = $('cName').value.trim();
    if(name.length < 2 || name.length > 20){ tell(t('닉네임은 2~20자로 적어 주세요')); return; }
    if(isBad(name)){ tell(t('욕설이나 비하 표현은 쓸 수 없습니다')); return; }
    try{
      await FB.F.setDoc(dref('users', ME.uid), { name, lang: langNow(), created: now(),
        consent: { ver: CONSENT_VER, at: now() }, blocked: (ME.blocked || []) }, { merge: true });
      ME.name = name; ME.ready = true;
      closeSheet(null); tell(t('환영합니다') + ', ' + name);
      refreshAfterAuth();
    }catch(e){ tell(t('잠시 후 다시 시도해 주세요')); }
  };
}

async function loadGuides(force){

// ★ 번역 (누를 때만) — 서버 함수 tr. 함수가 없으면 구글 번역 창을 연다.
// ══════════════════════════════════════════════════════════════════════
const TR_CACHE = {};
async function translate(text){
  const to = langNow();
  const key = to + '|' + text;
  if(TR_CACHE[key]) return TR_CACHE[key];
  await fb();
  const call = FB.Fn.httpsCallable(FB.fn, 'tr');
  const r = await call({ text: String(text).slice(0, 4000), to });
  TR_CACHE[key] = (r.data && r.data.text) || '';
  return TR_CACHE[key];
}
function bindTranslate(btn, text, slot){
  let shown = false;
  btn.onclick = async () => {
    if(shown){ slot.innerHTML = ''; btn.textContent = t('번역'); shown = false; return; }
    btn.disabled = true;
    try{
      const v = await translate(text);
      slot.innerHTML = '<div class="trbox">' + plain(v) + '</div>';
      btn.textContent = t('원문 보기'); shown = true;
    }catch(e){
      const url = 'https://translate.google.com/?sl=auto&tl=' + langNow() + '&op=translate&text=' + encodeURIComponent(String(text).slice(0, 1500));
      window.open(url, '_blank', 'noopener');
    }
    btn.disabled = false;
  };
}

// ★ 화면 이동 — 탭 다섯 개 + 깊은 화면(s-page). 뒤로 가기는 쌓인 순서대로.

const ROOT = { home:'s-home', guides:'s-guides', qa:'s-qa', biz:'s-biz', more:'s-more' };
const TAB_NAME = { home:'홈', guides:'정보', qa:'질문', biz:'업소', more:'더보기' };
let curTab = 'home';
let stack = [];
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}
function setTitle(txt, isSub){ $('title').textContent = txt; $('top').classList.toggle('sub', !!isSub); }
function setFab(label, fn){
  const b = $('fab');
  if(!label){ b.style.display = 'none'; b.onclick = null; return; }
  b.textContent = label; b.onclick = fn; b.style.display = '';
}
function openTab(tab){
  curTab = tab;
  if(stack.length){ const n = stack.length; stack = []; try{ history.go(-n); skipPop++; }catch(_){} }
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  setFab(null);
  RENDER[tab]();
  show(ROOT[tab]);
  setTitle(tab === 'home' ? 'Свои' : t(TAB_NAME[tab]), false);
}
let skipPop = 0;
function push(title, render){
  stack.push({ title, render });
  setFab(null);
  render(); show('s-page'); setTitle(title, true);
  try{ history.pushState({ d: stack.length }, ''); }catch(_){}
}
function back(){
  if($('sheet').classList.contains('on')){ closeSheet(null); try{ history.pushState({ d: stack.length }, ''); }catch(_){} return; }
  if(!stack.length) return;
  stack.pop();
  setFab(null);
  if(stack.length){ const top = stack[stack.length-1]; top.render(); show('s-page'); setTitle(top.title, true); }
  else { RENDER[curTab](); show(ROOT[curTab]); setTitle(curTab === 'home' ? 'Свои' : t(TAB_NAME[curTab]), false); }
}
// 일을 마친 깊은 화면을 닫는다 (쓰기 화면 등)
function popPage(){ if(stack.length) history.back(); }
window.addEventListener('popstate', () => { if(skipPop > 0){ skipPop--; return; } back(); });
$('backBtn').onclick = () => { history.back(); };
function page(){ return $('s-page'); }

function openSearch(q){
  const s = q.toLowerCase();
  push(t('검색') + ': ' + q, () => withLoad(page(), () => Promise.all([loadGuides(), loadPosts()]), ([gs, ps]) => {
    const hit = v => String(v || '').toLowerCase().indexOf(s) >= 0;
    const g = gs.filter(x => x.pub && (hit(x.title && x.title.ru) || hit(x.title && x.title.ko) || hit(x.body && x.body.ru) || hit(x.body && x.body.ko)));
    const p = ps.filter(x => !x.hidden && !isBlocked(x.uid) && (hit(x.title) || hit(x.body)));
    const box = page();
    if(!g.length && !p.length){ box.innerHTML = '<div class="empty">' + esc(t('검색 결과가 없습니다')) + '</div>'; return; }
    box.innerHTML = (g.length ? '<h3 class="muted" style="margin:4px 0 8px">' + esc(t('문서')) + '</h3>' + guideRows(g) : '') +
      (p.length ? '<h3 class="muted" style="margin:14px 0 8px">' + esc(t('질문')) + '</h3>' + postRows(p) : '');
    bindGuideRows(box); bindPostRows(box);
  }));
}

// 사진 줄이기 → jpeg Blob (긴 변 1280)
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82);
    };
    img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
async function uploadPhoto(blob){
  await fb();
  const path = 'u/' + ME.uid + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = FB.S.ref(FB.st, path);
  await FB.S.uploadBytes(r, blob, { contentType: 'image/jpeg' });
  return FB.S.getDownloadURL(r);
}
// 질문 쓰기 / 고치기 (post 가 있으면 고치기)
function openWrite(post, cat){
  if(!needLogin(() => openWrite(post, cat))) return;
  const st = { cat: (post && post.cat) || cat || '', photos: (post && post.photos ? post.photos.slice() : []), files: [] };
  push(post ? t('수정') : t('질문 쓰기'), () => {
    const box = page();
    box.innerHTML =
      '<label class="f">' + esc(t('분류')) + '</label><button class="opt" id="wCat">' + esc(st.cat ? catName(st.cat) : t('분류를 골라 주세요')) + '</button>' +
      '<label class="f">' + esc(t('제목')) + '</label><input id="wTitle" maxlength="120" value="' + esc(post ? post.title : '') + '">' +
      '<label class="f">' + esc(t('내용')) + '</label><textarea id="wBody" maxlength="5000">' + esc(post ? post.body : '') + '</textarea>' +
      '<p class="muted small" style="margin-top:6px">' + esc(t('개인정보(외국인등록번호·여권번호·전화번호)는 적지 마세요.')) + '</p>' +
      '<label class="f">' + esc(t('사진')) + '</label><div class="photos" id="wPh"></div>' +
      '<button class="btn gray wide" id="wAdd">' + esc(t('사진 넣기')) + '</button><input type="file" id="wFile" accept="image/*" multiple hidden>' +
      '<button class="btn wide" id="wGo">' + esc(post ? t('저장') : t('올리기')) + '</button>';
    const drawPh = () => {
      $('wPh').innerHTML = st.photos.map((u, i) => '<img src="' + esc(u) + '" data-i="' + i + '">').join('') +
        st.files.map((f, i) => '<img src="' + esc(f.url) + '" data-f="' + i + '">').join('');
      $('wPh').querySelectorAll('img').forEach(im => im.onclick = async () => {
        if(!(await ask(t('삭제할까요?'), t('삭제'), true))) return;
        if(im.dataset.i != null) st.photos.splice(+im.dataset.i, 1); else st.files.splice(+im.dataset.f, 1);
        drawPh();
      });
    };
    drawPh();
    $('wCat').onclick = async () => {
      const v = await choose(t('분류'), QA_CATS.map(c => ({ v: c.id, label: t(c.name) })), st.cat);
      if(v){ st.cat = v; $('wCat').textContent = catName(v); }
    };
    $('wAdd').onclick = () => $('wFile').click();
    $('wFile').onchange = async e => {
      for(const f of [...e.target.files]){
        if(st.photos.length + st.files.length >= 3){ tell(t('사진은 3장까지')); break; }
        try{ const b = await shrink(f); st.files.push({ blob: b, url: URL.createObjectURL(b) }); }catch(_){}
      }
      e.target.value = ''; drawPh();
    };
    $('wGo').onclick = async () => {
      const title = $('wTitle').value.trim(), body = $('wBody').value.trim();
      if(!st.cat){ tell(t('분류를 골라 주세요')); return; }
      if(!title){ tell(t('제목을 적어 주세요')); return; }
      if(!body){ tell(t('내용을 적어 주세요')); return; }
      if(isBad(title) || isBad(body)){ tell(t('욕설이나 비하 표현은 쓸 수 없습니다')); return; }
      const btn = $('wGo'); btn.disabled = true;
      try{
        const urls = st.photos.slice();
        for(const f of st.files) urls.push(await uploadPhoto(f.blob));
        if(post){
          await FB.F.updateDoc(dref('posts', post.id), { title, body, cat: st.cat, photos: urls, edited: now() });
          tell(t('수정했습니다'));
        }else{
          await FB.F.addDoc(col('posts'), { uid: ME.uid, name: ME.name, lang: langNow(), cat: st.cat, title, body, photos: urls,
            created: now(), last: now(), answers: 0, solved: false, hidden: false });
          tell(t('올렸습니다'));
        }
        await loadPosts(true);
        popPage();
      }catch(e){ console.warn(e); tell(t('잠시 후 다시 시도해 주세요')); btn.disabled = false; }
    };
  });
}

async function blockUser(uid){

// 사업자등록번호 검증 (국세청 검증식)
function bizNoOk(v){
  const d = String(v || '').replace(/\D/g, '');
  if(d.length !== 10) return false;
  const w = [1,3,7,1,3,7,1,3,5];
  let s = 0;
  for(let i = 0; i < 9; i++) s += (+d[i]) * w[i];
  s += Math.floor((+d[8]) * 5 / 10);
  return (10 - (s % 10)) % 10 === +d[9];
}

function cardState(){ try{ return JSON.parse(localStorage.getItem('sv_cards') || '{}'); }catch(_){ return {}; } }
function saveCardState(s){ try{ localStorage.setItem('sv_cards', JSON.stringify(s)); }catch(_){} }
const DAY = 86400000;
function dueCards(deck){
  const s = cardState()[deck] || {};
  const n = Date.now();
  const due = [], fresh = [];
  DECKS[deck].cards.forEach((c, i) => { const r = s[i]; if(!r) fresh.push(i); else if(r.due <= n) due.push(i); });
  return due.concat(fresh.slice(0, 10));   // 새 카드는 하루 10장
}
function openCardsHome(){
  push(t('단어 카드'), () => {
    const order = langNow() === 'ko' ? ['ru', 'ko'] : ['ko', 'ru'];
    const all = cardState();
    page().innerHTML = order.map(k => {
      const learned = Object.keys(all[k] || {}).length;
      return '<button class="row" data-deck="' + k + '"><b>' + esc(t(DECKS[k].name)) + '</b><small>' + esc(t(DECKS[k].hint)) + '<br>' +
        esc(t('오늘 볼 카드')) + ': ' + dueCards(k).length + ' · ' + esc(t('배운 카드')) + ': ' + learned + '/' + DECKS[k].cards.length + '</small></button>';
    }).join('');
    page().querySelectorAll('[data-deck]').forEach(b => b.onclick = () => playDeck(b.dataset.deck));
  });
}
function playDeck(deck){
  let queue = dueCards(deck), flipped = false;
  push(t(DECKS[deck].name), function draw(){
    const box = page();
    if(!queue.length){
      box.innerHTML = '<div class="card empty"><p><b>' + esc(t('오늘 할 카드를 다 봤습니다')) + '</b></p></div>' +
        '<button class="btn gray wide" id="cdReset">' + esc(t('처음부터 다시')) + '</button>';
      $('cdReset').onclick = async () => {
        if(!(await ask(t('처음부터 다시') + '?', t('확인')))) return;
        const s = cardState(); delete s[deck]; saveCardState(s); queue = dueCards(deck); draw();
      };
      return;
    }
    const c = DECKS[deck].cards[queue[0]];
    box.innerHTML = '<div class="card fc"><div class="w">' + esc(c[0]) + '</div><div class="r">' + esc(c[1]) + '</div>' +
      (flipped ? '<div class="m">' + esc(c[2]) + '</div>' : '') + '</div>' +
      (flipped ? '<div class="grades">' + [['0','다시'],['1','어려움'],['2','알았음'],['3','쉬움']].map(g =>
        '<button class="btn' + (g[0] === '0' ? ' gray' : '') + '" data-g="' + g[0] + '">' + esc(t(g[1])) + '</button>').join('') + '</div>'
        : '<button class="btn wide" id="cdFlip">' + esc(t('뒤집기')) + '</button>') +
      '<p class="muted small" style="text-align:center;margin-top:10px">' + queue.length + '</p>';
    if(!flipped) $('cdFlip').onclick = () => { flipped = true; draw(); };
    box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const g = +b.dataset.g, i = queue.shift(), s = cardState();
      s[deck] = s[deck] || {};
      const r = s[deck][i] || { ivl: 0, ease: 2.5 };
      if(g === 0){ r.ivl = 0; r.ease = Math.max(1.3, r.ease - 0.2); queue.push(i); }
      else {
        r.ivl = r.ivl ? r.ivl * (g === 1 ? 1.2 : g === 2 ? r.ease : r.ease * 1.3) : (g === 1 ? 1 : g === 2 ? 2 : 4);
        r.ease = Math.max(1.3, r.ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0));
      }
      r.due = Date.now() + Math.round(r.ivl * DAY);
      s[deck][i] = r; saveCardState(s);
      flipped = false; draw();
    });
  });
}

async function deleteAccount(){

  const u = FB.auth.currentUser; if(!u) return;
  try{
    // 내 질문 작성자 이름을 바꾼다
    const s = await FB.F.getDocs(FB.F.query(col('posts'), FB.F.where('uid', '==', u.uid)));
    const gone = t('탈퇴한 회원');
    for(let i = 0; i < s.docs.length; i += 400){
      const b = FB.F.writeBatch(FB.db);
      s.docs.slice(i, i + 400).forEach(d => b.update(d.ref, { name: gone }));
      await b.commit();
    }
    await FB.F.deleteDoc(dref('users', u.uid));
    await FB.A.deleteUser(u);
    ME = null; DATA.posts = null;
    tell(t('탈퇴했습니다')); openTab('home');
  }catch(e){
    console.warn(e);
    if(e && /requires-recent-login/.test(e.code || '')){
      tell(t('보안을 위해 다시 로그인한 뒤 탈퇴해 주세요'), 5000);
      await FB.A.signOut(FB.auth); ME = null; openLogin();
    }else tell(t('잠시 후 다시 시도해 주세요'));
  }
}

    page().innerHTML = [['adRep','신고 목록'],['adBiz','업소 심사'],['adNews','소식 관리'],['adGuide','문서 관리'],['adCfg','텔레그램·소식 수집 설정']].map(x =>
      '<button class="row" id="' + x[0] + '"><b>' + esc(t(x[1])) + '</b></button>').join('');
    $('adRep').onclick = adminReports; $('adBiz').onclick = adminBiz; $('adNews').onclick = adminNews; $('adGuide').onclick = adminGuides;
    $('adCfg').onclick = adminConfig;
  });
}
// 텔레그램 채널 자동 게시 · RSS 소식 수집 주소 (토큰은 화면에 다시 보여 주지 않는다)
function adminConfig(){
  push(t('텔레그램·소식 수집 설정'), () => withLoad(page(), async () => {
    const [tg, nw] = await Promise.all([FB.F.getDoc(dref('config', 'telegram')), FB.F.getDoc(dref('config', 'news'))]);
    return { tg: tg.exists() ? tg.data() : {}, feeds: nw.exists() ? (nw.data().feeds || []) : [] };
  }, ({ tg, feeds }) => {
    const box = page();
    box.innerHTML = '<div class="card"><h2>Telegram</h2>' +
      '<label class="f">' + esc(t('채널 주소')) + '</label><input id="cfCh" placeholder="@svoi_korea" value="' + esc(tg.channel || '') + '">' +
      '<label class="f">' + esc(t('봇 토큰')) + '</label><input id="cfTok" type="password" autocomplete="off" placeholder="' +
        esc(tg.token ? t('저장되어 있음 — 바꿀 때만 입력') : '123456:ABC…') + '">' +
      '<p class="muted small" style="margin-top:6px">' + esc(t('봇을 채널 관리자로 넣어야 올라갑니다. 공개한 소식만 한 번씩 올립니다.')) + '</p>' +
      '<button class="btn wide" id="cfTgGo">' + esc(t('저장')) + '</button></div>' +
      '<div class="card"><h2>RSS</h2><p class="muted small">' + esc(t('한 줄에 하나: 주소 | 출처 이름. 6시간마다 모아 「대기」로 넣습니다.')) + '</p>' +
      '<textarea id="cfFeeds" style="margin-top:8px">' + esc(feeds.map(f => f.url + (f.src ? ' | ' + f.src : '')).join('\n')) + '</textarea>' +
      '<button class="btn wide" id="cfFdGo">' + esc(t('저장')) + '</button></div>';
    $('cfTgGo').onclick = async () => {
      const d = { channel: $('cfCh').value.trim() };
      const tok = $('cfTok').value.trim(); if(tok) d.token = tok;
      await FB.F.setDoc(dref('config', 'telegram'), d, { merge: true });
      $('cfTok').value = ''; tell(t('저장했습니다'));
    };
    $('cfFdGo').onclick = async () => {
      const list = $('cfFeeds').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
        const [url, src] = l.split('|').map(x => x.trim()); return { url, src: src || '' };
      }).filter(f => /^https?:\/\//.test(f.url));
      await FB.F.setDoc(dref('config', 'news'), { feeds: list }, { merge: true });
      tell(t('저장했습니다'));
    };
  }));
}
function adminReports(){
  push(t('신고 목록'), () => withLoad(page(), async () => {
    const s = await FB.F.getDocs(FB.F.query(col('reports'), FB.F.where('open', '==', true)));
    return s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => msOf(b.created) - msOf(a.created));
  }, list => {
    const box = page();
    box.innerHTML = list.length ? list.map(r => '<div class="card"><b>' + esc(t(r.reason)) + '</b><p class="meta">' + esc(r.kind) + ' · ' + esc(r.path) + ' · ' + esc(ago(r.created)) + '</p>' +
      '<div class="bar"><button class="btn gray" data-open="' + esc(r.id) + '">' + esc(t('보기')) + '</button>' +
      '<button class="btn gray" data-hide="' + esc(r.id) + '">' + esc(t('가리기')) + '</button>' +
      '<button class="btn gray" data-ban="' + esc(r.id) + '">' + esc(t('이용 제한')) + '</button>' +
      '<button class="btn" data-done="' + esc(r.id) + '">' + esc(t('처리 완료')) + '</button></div></div>').join('')
      : '<div class="empty">' + esc(t('처리할 것이 없습니다')) + '</div>';
    const R = id => list.find(x => x.id === id);
    box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
      const p = R(b.dataset.open).path.split('/');
      if(p[0] === 'posts') openPost(p[1]); else if(p[0] === 'biz') openBizItem(p[1]);
    });
    box.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
      const r = R(b.dataset.hide), p = r.path.split('/');
      if(p[0] === 'biz') await FB.F.updateDoc(FB.F.doc(FB.db, r.path), { status: 'no' });
      else await FB.F.updateDoc(FB.F.doc(FB.db, r.path), { hidden: true });
      await FB.F.updateDoc(dref('reports', r.id), { open: false, done: now() });
      DATA.posts = null; DATA.biz = null; tell(t('처리 완료')); back2();
    });
    box.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => banUser(R(b.dataset.ban).target));
    box.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
      await FB.F.updateDoc(dref('reports', b.dataset.done), { open: false, done: now() }); back2();
    });
  }));
}
function adminBiz(){
  push(t('업소 심사'), () => withLoad(page(), async () => {
    const s = await FB.F.getDocs(FB.F.query(col('biz'), FB.F.where('status', '==', 'pending')));
    return s.docs.map(d => Object.assign({ id: d.id }, d.data()));
  }, list => {
    const box = page();
    box.innerHTML = list.length ? list.map(b => '<div class="card"><b>' + esc(b.name) + '</b><p class="meta">' + esc(bizCatName(b.cat)) + ' · ' + esc(cityName(b.city)) +
      '<br>' + esc(b.addr || '') + '<br>' + esc(b.phone || '') + ' ' + esc(b.tg || '') + '<br>' + esc(t('사업자등록번호')) + ': ' + esc(b.bizNo || '') + '</p>' +
      '<div class="bar"><button class="btn gray" data-v="' + esc(b.id) + '">' + esc(t('보기')) + '</button>' +
      '<button class="btn gray" data-no="' + esc(b.id) + '">' + esc(t('반려')) + '</button>' +
      '<button class="btn" data-ok="' + esc(b.id) + '">' + esc(t('승인')) + '</button></div></div>').join('')
      : '<div class="empty">' + esc(t('처리할 것이 없습니다')) + '</div>';
    box.querySelectorAll('[data-v]').forEach(b => b.onclick = () => openBizItem(b.dataset.v));
    box.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { await FB.F.updateDoc(dref('biz', b.dataset.ok), { status: 'ok', approved: now() }); DATA.biz = null; back2(); });
    box.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => { await FB.F.updateDoc(dref('biz', b.dataset.no), { status: 'no' }); DATA.biz = null; back2(); });
  }));
}
function adminNews(){
  push(t('소식 관리'), () => withLoad(page(), async () => {
    const s = await FB.F.getDocs(FB.F.query(col('news'), FB.F.orderBy('created', 'desc'), FB.F.limit(60)));
    return s.docs.map(d => Object.assign({ id: d.id }, d.data()));
  }, list => {
    const box = page();
    box.innerHTML = '<button class="btn wide" id="nwNew" style="margin:0 0 12px">' + esc(t('새 소식')) + '</button>' +
      (list.length ? list.map(n => '<button class="row" data-n="' + esc(n.id) + '"><b>' +
        (n.status !== 'ok' ? '<span class="badge warn">' + esc(t('대기')) + '</span> ' : '') + esc(pickL(n.title) || '—') + '</b><small>' + esc(n.src || '') + ' · ' + esc(ago(n.created)) + '</small></button>').join('')
        : '<div class="empty">' + esc(t('소식이 없습니다')) + '</div>');
    $('nwNew').onclick = () => newsEdit(null);
    box.querySelectorAll('[data-n]').forEach(b => b.onclick = () => newsEdit(list.find(x => x.id === b.dataset.n)));
  }));
}
function newsEdit(n){
  push(n ? t('수정') : t('새 소식'), () => {
    const v = (o, k) => esc(o && o[k] ? o[k] : '');
    const box = page();
    box.innerHTML =
      '<label class="f">' + esc(t('제목 (러시아어)')) + '</label><input id="neTr" value="' + v(n && n.title, 'ru') + '">' +
      '<label class="f">' + esc(t('제목 (한국어)')) + '</label><input id="neTk" value="' + v(n && n.title, 'ko') + '">' +
      '<label class="f">' + esc(t('본문 (러시아어)')) + '</label><textarea id="neBr">' + v(n && n.body, 'ru') + '</textarea>' +
      '<label class="f">' + esc(t('본문 (한국어)')) + '</label><textarea id="neBk">' + v(n && n.body, 'ko') + '</textarea>' +
      '<label class="f">' + esc(t('원문')) + '</label><input id="neSrc" placeholder="hikorea.go.kr" value="' + v(n, 'src') + '">' +
      '<label class="f">' + esc(t('링크')) + '</label><input id="neUrl" inputmode="url" value="' + v(n, 'url') + '">' +
      '<div class="two" style="margin-top:14px"><button class="btn gray" id="neHide">' + esc(t('비공개')) + '</button><button class="btn" id="neGo">' + esc(t('공개')) + '</button></div>' +
      (n ? '<button class="btn gray wide" id="neDel">' + esc(t('삭제')) + '</button>' : '');
    const save = async status => {
      const d = { title: { ru: $('neTr').value.trim(), ko: $('neTk').value.trim() }, body: { ru: $('neBr').value.trim(), ko: $('neBk').value.trim() },
        src: $('neSrc').value.trim(), url: $('neUrl').value.trim(), status };
      if(!d.title.ru && !d.title.ko){ tell(t('제목을 적어 주세요')); return; }
      if(n) await FB.F.updateDoc(dref('news', n.id), d);
      else await FB.F.addDoc(col('news'), Object.assign(d, { created: now(), tg: false }));
      DATA.news = null; tell(t('저장했습니다')); popPage();
    };
    $('neGo').onclick = () => save('ok');
    $('neHide').onclick = () => save('pending');
    if($('neDel')) $('neDel').onclick = async () => { if(await ask(t('삭제할까요?'), t('삭제'), true)){ await FB.F.deleteDoc(dref('news', n.id)); DATA.news = null; popPage(); } };
  });
}
function adminGuides(){
  push(t('문서 관리'), () => withLoad(page(), () => loadGuides(true), list => {
    const box = page();
    box.innerHTML = '<button class="btn wide" id="ggNew" style="margin:0 0 12px">' + esc(t('새 문서')) + '</button>' +
      GUIDE_CATS.map(c => {
        const gs = list.filter(g => g.cat === c.id);
        return gs.length ? '<h3 class="muted" style="margin:12px 0 8px">' + esc(t(c.name)) + '</h3>' + gs.map(g => '<button class="row" data-g="' + esc(g.id) + '"><b>' +
          (g.pub ? '' : '<span class="badge warn">' + esc(t('숨김')) + '</span> ') + esc(pickL(g.title)) + '</b><small>' + (g.views || 0) + '</small></button>').join('') : '';
      }).join('');
    $('ggNew').onclick = () => openGuideEdit(null);
    box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGuideEdit(b.dataset.g));
  }));
}
function openGuideEdit(id){
  const g = id ? (DATA.guides || []).find(x => x.id === id) : null;
  const st = { cat: g ? g.cat : '' };
  push(g ? t('수정') : t('새 문서'), () => {
    const v = (o, k) => esc(o && o[k] ? o[k] : '');
    const today = new Date().toISOString().slice(0, 10);
    const box = page();
    box.innerHTML =
      '<label class="f">' + esc(t('분류')) + '</label><button class="opt" id="geCat">' + esc(st.cat ? catName(st.cat) : t('분류를 골라 주세요')) + '</button>' +
      '<label class="f">' + esc(t('제목 (러시아어)')) + '</label><input id="geTr" value="' + v(g && g.title, 'ru') + '">' +
      '<label class="f">' + esc(t('제목 (한국어)')) + '</label><input id="geTk" value="' + v(g && g.title, 'ko') + '">' +
      '<p class="muted small" style="margin-top:12px">' + esc(t('본문 쓰는 법: ## 소제목, - 목록, 빈 줄은 문단')) + '</p>' +
      '<label class="f">' + esc(t('본문 (러시아어)')) + '</label><textarea id="geBr" style="min-height:260px">' + v(g && g.body, 'ru') + '</textarea>' +
      '<label class="f">' + esc(t('러시아어판 확인일')) + '</label><input id="geCr" type="date" value="' + (v(g && g.checked, 'ru') || today) + '">' +
      '<label class="f">' + esc(t('본문 (한국어)')) + '</label><textarea id="geBk" style="min-height:260px">' + v(g && g.body, 'ko') + '</textarea>' +
      '<label class="f">' + esc(t('한국어판 확인일')) + '</label><input id="geCk" type="date" value="' + (v(g && g.checked, 'ko') || today) + '">' +
      '<label class="f">' + esc(t('공식 확인처')) + '</label><input id="geSrc" inputmode="url" value="' + v(g, 'src') + '">' +
      '<div class="two" style="margin-top:14px"><button class="btn gray" id="geHide">' + esc(t('비공개')) + '</button><button class="btn" id="geGo">' + esc(t('공개')) + '</button></div>' +
      (g ? '<button class="btn gray wide" id="geDel">' + esc(t('삭제')) + '</button>' : '');
    $('geCat').onclick = async () => { const c = await choose(t('분류'), GUIDE_CATS.map(x => ({ v: x.id, label: t(x.name) })), st.cat); if(c){ st.cat = c; $('geCat').textContent = catName(c); } };
    const save = async pub => {
      if(!st.cat){ tell(t('분류를 골라 주세요')); return; }
      const d = { cat: st.cat, title: { ru: $('geTr').value.trim(), ko: $('geTk').value.trim() }, body: { ru: $('geBr').value, ko: $('geBk').value },
        checked: { ru: $('geCr').value, ko: $('geCk').value }, src: $('geSrc').value.trim(), pub, updated: now() };
      if(!d.title.ru && !d.title.ko){ tell(t('제목을 적어 주세요')); return; }
      if(g) await FB.F.updateDoc(dref('guides', g.id), d);
      else await FB.F.addDoc(col('guides'), Object.assign(d, { views: 0, created: now() }));
      await loadGuides(true); tell(t('저장했습니다')); popPage();
    };
    $('geGo').onclick = () => save(true);
    $('geHide').onclick = () => save(false);
    if($('geDel')) $('geDel').onclick = async () => { if(await ask(t('삭제할까요?'), t('삭제'), true)){ await FB.F.deleteDoc(dref('guides', g.id)); await loadGuides(true); popPage(); } };
  });
}

async function pickLang(){
  const v = await choose(t('언어 고르기'), LANGS.map(l => ({ v: l.v, label: l.name })), langNow());
  if(!v) return;
  try{ localStorage.setItem('sv_lang', v); }catch(_){}
  paintStatic();
  if(stack.length){ const top = stack[stack.length-1]; top.render(); } else openTab(curTab);
}
$('langBtn').onclick = pickLang;
