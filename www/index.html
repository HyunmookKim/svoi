<!DOCTYPE html>
<!-- Свои 0.4 -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Свои — жизнь в Корее</title>
<meta name="description" content="Свои (스바이) — визы, работа, жильё и проверенные места в Корее по-русски.">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ── 테마: 밝게(화이트) · 어둡게(블랙). html[data-theme] 로 바꾼다 */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#F7F8FA; --ink:#111316; --sub:#6B7280; --faint:#9CA3AF; --line:#E8EAEE;
  --main:#111316; --onMain:#FFFFFF; --accent:#2F6BFF; --accentS:rgba(47,107,255,.10);
  --ok:#14A36B; --okS:rgba(20,163,107,.12); --warn:#E5484D; --warnS:rgba(229,72,77,.12);
  --bar:rgba(242,243,245,.82); --tabbar:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(17,19,22,.04),0 4px 16px rgba(17,19,22,.05);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#000000; --card:#121316; --card2:#1A1C20; --ink:#F3F4F6; --sub:#9AA0A9; --faint:#6B7079; --line:#24262B;
  --main:#F3F4F6; --onMain:#0B0C0E; --accent:#6F9BFF; --accentS:rgba(111,155,255,.14);
  --ok:#3DD68C; --okS:rgba(61,214,140,.14); --warn:#FF6369; --warnS:rgba(255,99,105,.14);
  --bar:rgba(0,0,0,.78); --tabbar:rgba(14,15,18,.86); --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);width:100%;border:1px solid transparent;
  border-radius:14px;padding:14px 16px;background:var(--card2);outline:none;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
label.f{display:block;font-size:13px;color:var(--sub);margin:18px 0 8px;font-weight:600}
/* 위 띠 — 색 띠 대신 배경과 같은 흐린 유리 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);padding:calc(var(--top) + 10px) 18px 10px;display:flex;align-items:center;gap:8px}
#top h1{font-size:22px;font-weight:800;letter-spacing:-.03em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top.sub h1{font-size:17px;font-weight:700;text-align:center}
#top .back{display:none;width:40px;height:40px;margin-left:-10px;border-radius:12px;align-items:center;justify-content:center}
#top.sub .back{display:flex}
#top .back svg{width:24px;height:24px}
#langBtn{min-width:44px;height:34px;padding:0 12px;border-radius:17px;background:var(--card);font-size:13px;font-weight:700;box-shadow:var(--shadow);border:1px solid var(--line)}
main{padding:calc(var(--top) + 64px) 16px calc(var(--bot) + 96px);max-width:720px;margin:0 auto}
.screen{display:none;animation:fade .18s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 카드 · 묶음 목록 */
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
html[data-theme="dark"] .card{border:1px solid var(--line)}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:14px;font-weight:600;color:var(--sub)}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.empty{padding:44px 16px;text-align:center;color:var(--sub)}
.empty b{color:var(--ink);font-size:17px}
.load{padding:28px;text-align:center;color:var(--faint);font-size:14px}
/* 분류 칸 — 아이콘 칩 */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--card);border-radius:20px;padding:16px;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:2px;
  box-shadow:var(--shadow);transition:transform .1s}
html[data-theme="dark"] .cat{border:1px solid var(--line)}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
.cat b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.cat span{font-size:12.5px;color:var(--sub);line-height:1.4}
.cat:active,.row:active,.link:active{transform:scale(.985);opacity:.85}
.row{display:block;position:relative;width:100%;text-align:left;background:var(--card);border-radius:18px;
  padding:16px 44px 16px 18px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .1s}
html[data-theme="dark"] .row{border:1px solid var(--line)}
.row::after{content:"";position:absolute;right:20px;top:50%;width:8px;height:8px;margin-top:-5px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);transform:rotate(45deg)}
div.row::after{display:none}
div.row{padding-right:18px}
.row b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;word-break:break-word}
.row small{display:block;color:var(--sub);font-size:13px;margin-top:3px}
.row .txt{flex:1;min-width:0}
.link{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;transition:transform .1s}
.link small{font-weight:400}
.link:last-child{border-bottom:0;padding-bottom:2px}
/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:16px;
  background:var(--main);color:var(--onMain);font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98)}
.btn.wide{display:flex;width:100%;margin-top:14px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.gray{background:var(--card2);color:var(--ink)}
.btn.red{background:var(--warn);color:#fff}
.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--card);font-size:14px;font-weight:600;color:var(--sub);box-shadow:var(--shadow)}
html[data-theme="dark"] .chip{border:1px solid var(--line)}
.chip.on{background:var(--main);color:var(--onMain);border-color:var(--main)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--accentS);color:var(--accent);vertical-align:middle;letter-spacing:0}
.badge.ok{background:var(--okS);color:var(--ok)}
.badge.warn{background:var(--warnS);color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar .btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.meta{font-size:13px;color:var(--sub);margin-top:10px}
.body{word-break:break-word;font-size:16px;line-height:1.7}
.body h3{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:20px 0 8px}
.body h3:first-child{margin-top:0}
.body ul{padding-left:20px;margin:6px 0 12px}
.body li{margin:4px 0}
.body p{margin:0 0 12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card2)}
.ans{border-top:1px solid var(--line);padding:16px 0}
.ans:first-of-type{border-top:0;padding-top:4px}
.trbox{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card2);font-size:15px}
/* 검색 */
.search{position:relative;margin-bottom:14px}
.search input{padding-left:46px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;height:52px}
html[data-theme="dark"] .search input{border-color:var(--line)}
.search svg{position:absolute;left:16px;top:15px;width:22px;height:22px;color:var(--faint)}
.hello{margin:4px 2px 16px}
.hello h2{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.hello p{color:var(--sub);margin-top:6px;font-size:15px}
.check{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;flex:none;accent-color:var(--main);padding:0}
.check span{flex:1}
.check button{color:var(--sub);font-size:14px;text-decoration:underline}
.fab{position:fixed;right:18px;bottom:calc(var(--bot) + 84px);z-index:15;height:54px;padding:0 22px;border-radius:27px;
  background:var(--main);color:var(--onMain);font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* 카드 학습 */
.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:34px;font-weight:800;letter-spacing:-.03em}
.fc .r{font-size:16px;color:var(--sub)}
.fc .m{font-size:21px;font-weight:700;color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades .btn{padding:0 4px;font-size:14px}
/* 아래 탭 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--bot)}
#tabs button{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--ink)}
/* 아래에서 올라오는 창 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:10px 18px calc(var(--bot) + 20px);max-width:720px;margin:0 auto;animation:up .2s ease}
#sheet .box::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
#sheet .box h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
#sheet .box p{margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card2);
  margin-bottom:8px;font-size:16px;font-weight:600;border:1.5px solid transparent}
.opt small{font-weight:400}
.opt.on{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 84px);z-index:50;background:var(--ink);color:var(--bg);
  padding:14px 16px;border-radius:14px;font-size:15px;font-weight:600;display:none;max-width:680px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{display:block;animation:up .2s ease}
/* 홈 큰 단추 */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.hero button{background:var(--main);color:var(--onMain);border-radius:22px;padding:18px 16px;text-align:left;min-height:150px;
  display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.hero button:active{transform:scale(.98)}
.hero button:nth-child(2){background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
html[data-theme="dark"] .hero button:nth-child(2){border:1px solid var(--line)}
.hero .ic{font-size:30px;margin-bottom:auto}
.hero b{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.hero span{font-size:12.5px;opacity:.72;line-height:1.35}
h3.sec{font-size:14px;color:var(--sub);font-weight:700;margin:18px 4px 10px}
/* 문장 목록 */
.plist{padding:4px 18px}
.phrase{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em}
.phrase small{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.phrase span{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.show{min-height:46vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 8px}
.show .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.25;word-break:keep-all}
.show .pron{font-size:17px;color:var(--sub);margin-top:16px}
.show .mean{font-size:17px;color:var(--faint);margin-top:8px}
.btn svg{width:20px;height:20px}
/* 서류 풀이 */
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.pages:empty{display:none}
.pg{position:relative}
.pg img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--card2)}
.pg button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:26px}
.doc .lead{font-size:16.5px;line-height:1.6;margin:10px 0 6px}
.doc h3{font-size:16px;font-weight:800;margin:16px 0 6px}
.doc ul{padding-left:20px}
.doc li{margin:5px 0}
.kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span{flex:none;width:96px;color:var(--sub)}
.kv b{flex:1;font-weight:700;word-break:break-word}
.warnbox{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--warnS);color:var(--ink)}
.warnbox b{color:var(--warn)}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:700;color:var(--sub)}
details .body{margin-top:10px;font-size:15px}
</style>
</head>

<script>
'use strict';
const APP_VER = '0.4';
const CONSENT_VER = 1;
const CONTACT_EMAIL = 'jaha814@gmail.com';
const REGION = 'asia-northeast3';

// ══════════════════════════════════════════════════════════════════════
// ★ 화면 테마 — 자동(폰 설정) · 밝게 · 어둡게
// ══════════════════════════════════════════════════════════════════════
function themePref(){ try{ return localStorage.getItem('sv_theme') || 'auto'; }catch(_){ return 'auto'; } }
function themeNow(){
  const p = themePref();
  if(p === 'light' || p === 'dark') return p;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  const th = themeNow();
  document.documentElement.setAttribute('data-theme', th);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', th === 'dark' ? '#000000' : '#F2F3F5');
}
applyTheme();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(themePref() === 'auto') applyTheme(); }); }catch(_){}
const SEARCH_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

// ══════════════════════════════════════════════════════════════════════

const I18N = { ru: {
  '홈':'Главная', '정보':'Справка', '질문':'Вопросы', '업소':'Места', '더보기':'Ещё',

  '체류·비자':'Пребывание и визы', '일·노동':'Работа', '보험·병원':'Страховка и врачи',
  '돈':'Деньги', '집':'Жильё', '결혼·가족':'Брак и семья', '아이·학교':'Дети и школа',
  '교통·운전':'Транспорт и права', '긴급':'Экстренная помощь', '기타':'Другое',
  '연장·변경·외국인등록':'Продление, смена статуса, ID-карта',

function langFromDevice(){
  try{
    const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    for(const raw of list){
      const v = String(raw || '').slice(0,2).toLowerCase();
      if(v === 'ko') return 'ko';
      if(['ru','uk','kk','uz','ky','be','tg','az','hy','ka','tk'].indexOf(v) >= 0) return 'ru';
    }
  }catch(_){}
  return 'ru';
}
function langNow(){
  try{ const v = localStorage.getItem('sv_lang'); if(v && LANGS.some(x=>x.v===v)) return v; }catch(_){}
  return langFromDevice();
}
function t(s){
  const k = String(s == null ? '' : s);
  const v = langNow();
  if(v === 'ko') return k;
  const d = I18N[v] || {};
  return d[k] || k;
}

function pickL(o){ if(!o) return ''; if(typeof o === 'string') return o; const L = langNow(); return o[L] || o.ru || o.ko || ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 글 본문: 글자는 모두 escape 한 뒤 링크만 살린다
function linkify(s){
  return esc(s).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener nofollow">' + u + '</a>');
}
function plain(s){ return linkify(s).replace(/\n/g, '<br>'); }
// 문서 본문: ## 소제목 / - 목록 / 빈 줄 문단
function richText(s){
  const out = []; let list = null; let para = [];
  const flushP = () => { if(para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const flushL = () => { if(list){ out.push('<ul>' + list.join('') + '</ul>'); list = null; } };
  String(s || '').split('\n').forEach(line => {
    const l = line.trimEnd();
    if(/^##\s+/.test(l)){ flushP(); flushL(); out.push('<h3>' + linkify(l.replace(/^##\s+/, '')) + '</h3>'); }
    else if(/^-\s+/.test(l)){ flushP(); (list = list || []).push('<li>' + linkify(l.replace(/^-\s+/, '')) + '</li>'); }
    else if(!l.trim()){ flushP(); flushL(); }
    else { flushL(); para.push(linkify(l)); }
  });
  flushP(); flushL();
  return out.join('');
}
function ago(ts){
  const ms = ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : Date.now());
  const m = Math.floor((Date.now() - ms) / 60000);
  if(m < 1) return t('방금');
  if(m < 60) return m + ' ' + t('분 전');
  if(m < 1440) return Math.floor(m/60) + ' ' + t('시간 전');
  if(m < 1440*14) return Math.floor(m/1440) + ' ' + t('일 전');
  const d = new Date(ms);
  return d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate();
}
function msOf(ts){ return ts && ts.toMillis ? ts.toMillis() : 0; }

let FB = null, fbP = null;
function fb(){
  if(FB) return Promise.resolve(FB);
  if(fbP) return fbP;
  fbP = (async () => {
    const [A, Au, F, S, Fn, C] = await Promise.all([
      import('./firebase/app.js'), import('./firebase/auth.js'), import('./firebase/firestore.js'),
      import('./firebase/storage.js'), import('./firebase/functions.js'), import('./firebase-config.js')
    ]);
    const app = A.initializeApp(C.firebaseConfig);
    let db;
    try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); }catch(_){ db = F.getFirestore(app); }
    FB = { app, A:Au, F, S, Fn, auth: Au.getAuth(app), db, st: S.getStorage(app), fn: Fn.getFunctions(app, REGION) };
    return FB;
  })();
  fbP.catch(() => { fbP = null; });
  return fbP;
}
function col(...p){ return FB.F.collection(FB.db, ...p); }
function dref(...p){ return FB.F.doc(FB.db, ...p); }

// ★ 나 (로그인 상태)
//   ME = null → 로그인 안 함 / ME.ready=false → 동의·닉네임 아직
// ══════════════════════════════════════════════════════════════════════
let ME = null;
let authKnown = false;
async function watchAuth(){
  await fb();
  FB.A.onAuthStateChanged(FB.auth, async u => {
    if(!u){ ME = null; authKnown = true; DATA.guides = null; refreshAfterAuth(); return; }
    ME = { uid: u.uid, email: u.email || '', name: '', ready: false, admin: false, banned: false, blocked: [] };
    try{
      const [ud, ad, bd] = await Promise.all([
        FB.F.getDoc(dref('users', u.uid)),
        FB.F.getDoc(dref('admins', u.uid)).catch(() => null),
        FB.F.getDoc(dref('bans', u.uid)).catch(() => null)
      ]);
      if(ud.exists()){
        const d = ud.data();
        ME.name = d.name || ''; ME.blocked = d.blocked || [];
        ME.ready = !!(d.consent && d.consent.ver >= CONSENT_VER) && !!ME.name;
      }
      ME.admin = !!(ad && ad.exists());
      ME.banned = !!(bd && bd.exists());
    }catch(_){}
    authKnown = true; DATA.guides = null;
    if(!ME.ready) openConsent();
    refreshAfterAuth();
  });
}
function refreshAfterAuth(){
  // 지금 보고 있는 곳을 다시 그린다 (깊은 화면이면 그 화면을)
  if(stack.length){ const top = stack[stack.length-1]; top.render(); }
  else RENDER[curTab]();
  if(afterLogin && ME && ME.ready){ const f = afterLogin; afterLogin = null; f(); }
}
let afterLogin = null;
// 로그인이 필요한 일 앞에 세우는 문. 됐으면 true.
function needLogin(then){
  if(ME && ME.ready){
    if(ME.banned){ tell(t('이용이 제한된 계정입니다')); return false; }
    return true;
  }
  afterLogin = then || null;
  if(ME && !ME.ready){ openConsent(); return false; }
  openLogin();
  return false;
}
function authMsg(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t('이메일 또는 비밀번호가 맞지 않습니다');
  if(/email-already-in-use/.test(c)) return t('이미 가입된 이메일입니다');
  if(/weak-password/.test(c)) return t('비밀번호는 6자 이상이어야 합니다');
  if(/invalid-email/.test(c)) return t('이메일 형식이 맞지 않습니다');
  if(/popup-closed|cancelled-popup/.test(c)) return t('로그인 창이 닫혔습니다');
  if(/too-many-requests|network/.test(c)) return t('잠시 후 다시 시도해 주세요');
  return t('로그인하지 못했습니다');
}

    '<label class="check"><input type="checkbox" id="cAll"><span><b>' + esc(t('모두 동의')) + '</b></span></label>' +

  box.querySelectorAll('[data-doc]').forEach(b => b.onclick = ev => { ev.preventDefault(); closeSheet(null); openDoc(b.dataset.doc, true); });
  box.querySelector('#cOut').onclick = async () => { closeSheet(null); await FB.A.signOut(FB.auth); };

    if(name.length < 2 || name.length > 20){ tell(t('닉네임은 2~20자로 적어 주세요')); return; }
    if(isBad(name)){ tell(t('욕설이나 비하 표현은 쓸 수 없습니다')); return; }
    try{
      await FB.F.setDoc(dref('users', ME.uid), { name, lang: langNow(), created: now(),
        consent: { ver: CONSENT_VER, at: now() }, blocked: (ME.blocked || []) }, { merge: true });
      ME.name = name; ME.ready = true;
      closeSheet(null); tell(t('환영합니다') + ', ' + name);
      refreshAfterAuth();
    }catch(e){ tell(t('잠시 후 다시 시도해 주세요')); }
  };
}

// ★ 번역 (누를 때만) — 서버 함수 tr. 함수가 없으면 구글 번역 창을 연다.
// ══════════════════════════════════════════════════════════════════════
const TR_CACHE = {};
async function translate(text){
  const to = langNow();
  const key = to + '|' + text;
  if(TR_CACHE[key]) return TR_CACHE[key];
  await fb();
  const call = FB.Fn.httpsCallable(FB.fn, 'tr');
  const r = await call({ text: String(text).slice(0, 4000), to });
  TR_CACHE[key] = (r.data && r.data.text) || '';
  return TR_CACHE[key];
}
function bindTranslate(btn, text, slot){
  let shown = false;
  btn.onclick = async () => {
    if(shown){ slot.innerHTML = ''; btn.textContent = t('번역'); shown = false; return; }
    btn.disabled = true;
    try{
      const v = await translate(text);
      slot.innerHTML = '<div class="trbox">' + plain(v) + '</div>';
      btn.textContent = t('원문 보기'); shown = true;
    }catch(e){
      const url = 'https://translate.google.com/?sl=auto&tl=' + langNow() + '&op=translate&text=' + encodeURIComponent(String(text).slice(0, 1500));
      window.open(url, '_blank', 'noopener');
    }
    btn.disabled = false;
  };
}

// ★ 화면 이동 — 탭 다섯 개 + 깊은 화면(s-page). 뒤로 가기는 쌓인 순서대로.
// ══════════════════════════════════════════════════════════════════════
const ROOT = { home:'s-home', guides:'s-guides', qa:'s-qa', biz:'s-biz', more:'s-more' };
const TAB_NAME = { home:'홈', guides:'정보', qa:'질문', biz:'업소', more:'더보기' };
let curTab = 'home';
let stack = [];
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}
function setTitle(txt, isSub){ $('title').textContent = txt; $('top').classList.toggle('sub', !!isSub); }
function setFab(label, fn){
  const b = $('fab');
  if(!label){ b.style.display = 'none'; b.onclick = null; return; }
  b.textContent = label; b.onclick = fn; b.style.display = '';
}
function openTab(tab){
  curTab = tab;
  if(stack.length){ const n = stack.length; stack = []; try{ history.go(-n); skipPop++; }catch(_){} }
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  setFab(null);
  RENDER[tab]();
  show(ROOT[tab]);
  setTitle(tab === 'home' ? 'Свои' : t(TAB_NAME[tab]), false);
}
let skipPop = 0;
function push(title, render){
  stack.push({ title, render });
  setFab(null);
  render(); show('s-page'); setTitle(title, true);
  try{ history.pushState({ d: stack.length }, ''); }catch(_){}
}
function back(){
  if($('sheet').classList.contains('on')){ closeSheet(null); try{ history.pushState({ d: stack.length }, ''); }catch(_){} return; }
  if(!stack.length) return;
  stack.pop();
  setFab(null);
  if(stack.length){ const top = stack[stack.length-1]; top.render(); show('s-page'); setTitle(top.title, true); }
  else { RENDER[curTab](); show(ROOT[curTab]); setTitle(curTab === 'home' ? 'Свои' : t(TAB_NAME[curTab]), false); }
}
// 일을 마친 깊은 화면을 닫는다 (쓰기 화면 등)
function popPage(){ if(stack.length) history.back(); }
window.addEventListener('popstate', () => { if(skipPop > 0){ skipPop--; return; } back(); });

// 사진 줄이기 → jpeg Blob (긴 변 1280)
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82);
    };
    img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
async function uploadPhoto(blob){

  await FB.S.uploadBytes(r, blob, { contentType: 'image/jpeg' });
  return FB.S.getDownloadURL(r);
}

async function report(kind, path, target){

    await FB.F.addDoc(col('reports'), { kind, path, target: target || '', reason: v, by: ME.uid, created: now(), open: true });

  }catch(_){ tell(t('잠시 후 다시 시도해 주세요')); }

async function blockUser(uid){
  if(!needLogin() || !uid || uid === ME.uid) return;
  if(!(await ask(t('이 사람을 차단할까요?'), t('차단'), true))) return;
  await FB.F.updateDoc(dref('users', ME.uid), { blocked: FB.F.arrayUnion(uid) });
  ME.blocked = (ME.blocked || []).concat([uid]);
  tell(t('이 사람의 글이 더 이상 보이지 않습니다'));
  back2();
}
async function banUser(uid){
  if(!(ME && ME.admin) || !uid) return;

}

// 사업자등록번호 검증 (국세청 검증식)
function bizNoOk(v){
  const d = String(v || '').replace(/\D/g, '');
  if(d.length !== 10) return false;
  const w = [1,3,7,1,3,7,1,3,5];
  let s = 0;
  for(let i = 0; i < 9; i++) s += (+d[i]) * w[i];
  s += Math.floor((+d[8]) * 5 / 10);
  return (10 - (s % 10)) % 10 === +d[9];
}

      $('fGo').disabled = true;
      try{
        let photo = st.photo;
        if(st.file) photo = await uploadPhoto(st.file.blob);
        const data = { owner: ME.uid, name, cat: st.cat, city: st.city, addr: v('fAddr'), phone, tg, site: v('fSite'),
          ruOk: $('fRu').checked, desc: { ru: descRu, ko: descKo }, photo, bizNo: no, status: 'pending', updated: now(), top: b ? !!b.top : false };
        if(b) await FB.F.updateDoc(dref('biz', b.id), data);
        else await FB.F.addDoc(col('biz'), Object.assign(data, { created: now() }));
        DATA.biz = null;
        tell(t('등록 신청했습니다. 확인 후 공개됩니다.'), 4000);
        popPage();
      }catch(e){ console.warn(e); tell(t('잠시 후 다시 시도해 주세요')); $('fGo').disabled = false; }
    };
  });
}

function openNews(id){

function talkLang(){ return langNow() === 'ko' ? 'ru' : 'ko'; }
function savedTalk(){ try{ return JSON.parse(localStorage.getItem('sv_talk') || '[]'); }catch(_){ return []; } }
function setSavedTalk(a){ try{ localStorage.setItem('sv_talk', JSON.stringify(a.slice(0, 100))); }catch(_){} }
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ko' ? 'ko-KR' : 'ru-RU';
    u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(x => (x.lang || '').toLowerCase().startsWith(lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
    return true;
  }catch(_){ return false; }
}

function docHistory(){ try{ return JSON.parse(localStorage.getItem('sv_docs') || '[]'); }catch(_){ return []; } }
function setDocHistory(a){ try{ localStorage.setItem('sv_docs', JSON.stringify(a.slice(0, 30))); }catch(_){} }
function shrinkB64(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const d = c.toDataURL('image/jpeg', 0.82);
      res({ b64: d.split(',')[1], url: d });
    };
    img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}

      '<p class="muted small" style="margin-top:12px">🔒 ' + esc(t('사진은 저장하지 않고 읽은 뒤 바로 지웁니다. 외국인등록번호·여권번호가 보이면 가리고 찍으세요.')) + '</p></div>' +

function docResult(r, left){

async function deleteAccount(){
  if(!(await ask(t('탈퇴하면 계정이 지워지고 되돌릴 수 없습니다. 쓴 질문은 남지만 이름은 "탈퇴한 회원"으로 바뀝니다.'), t('탈퇴하기'), true))) return;
  const u = FB.auth.currentUser; if(!u) return;
  try{
    // 내 질문 작성자 이름을 바꾼다
    const s = await FB.F.getDocs(FB.F.query(col('posts'), FB.F.where('uid', '==', u.uid)));
    const gone = t('탈퇴한 회원');
    for(let i = 0; i < s.docs.length; i += 400){
      const b = FB.F.writeBatch(FB.db);
      s.docs.slice(i, i + 400).forEach(d => b.update(d.ref, { name: gone }));
      await b.commit();
    }
    await FB.F.deleteDoc(dref('users', u.uid));
    await FB.A.deleteUser(u);
    ME = null; DATA.posts = null;
    tell(t('탈퇴했습니다')); openTab('home');
  }catch(e){
    console.warn(e);
    if(e && /requires-recent-login/.test(e.code || '')){
      tell(t('보안을 위해 다시 로그인한 뒤 탈퇴해 주세요'), 5000);
      await FB.A.signOut(FB.auth); ME = null; openLogin();
    }else tell(t('잠시 후 다시 시도해 주세요'));
  }
}
